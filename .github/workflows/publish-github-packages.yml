# Manual publish of the resource-naming libraries to this account's GitHub Packages NuGet feed (alpha channel).
#
# This is the INTERNAL/alpha channel. For the public nuget.org release see publish-nuget.yml.
#
# Uses the built-in GITHUB_TOKEN (no stored secret). The version is the static VersionPrefix/VersionSuffix from
# src/Directory.Build.props. Packs Trellis.ResourceNaming.Abstractions and Trellis.ResourceNaming.Azure
# (the test project is not packable).
name: Publish to GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish to github packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build + test (gate)
        run: |
          dotnet build src/Trellis.ResourceNaming.slnx -c Release
          dotnet test src/Trellis.ResourceNaming.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack src/Trellis.ResourceNaming.slnx -c Release -o nupkg

      # Same gate as the nuget.org path. The alpha channel is where a doc-less package
      # would be discovered by a consumer first, so it is not the place to skip the check.
      # Verifies the artifacts produced above rather than packing its own copy.
      - name: Verify API reference packaging
        shell: pwsh
        run: ./build/test-apireference-packaging.ps1 -Configuration Release -PackageDirectory nupkg

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
