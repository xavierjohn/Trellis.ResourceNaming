# Manual publish of the resource-naming libraries to this account's GitHub Packages NuGet feed (alpha channel).
#
# This is the INTERNAL/alpha channel. For the public nuget.org release see publish-nuget.yml.
#
# Uses the built-in GITHUB_TOKEN for publishing and STRONG_NAME_KEY_BASE64 for assembly signing.
# The version is computed by Nerdbank.GitVersioning from version.json and git height. Packs
# Trellis.ResourceNaming.Abstractions and Trellis.ResourceNaming.Azure (the test project is not packable).
name: Publish to GitHub Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish to github packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Configure full strong-name signing
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
        run: ./build/configure-strong-name-signing.ps1

      - name: Build + test (gate)
        run: |
          dotnet build Trellis.ResourceNaming.slnx -c Release
          dotnet test Trellis.ResourceNaming.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack Trellis.ResourceNaming.slnx -c Release -o nupkg

      - name: Verify full strong-name signatures
        shell: pwsh
        run: ./build/test-strong-name-packaging.ps1 -PackageDirectory nupkg -RequireFullSignature

      # Same gate as the nuget.org path. The alpha channel is where a doc-less package
      # would be discovered by a consumer first, so it is not the place to skip the check.
      # Verifies the artifacts produced above rather than packing its own copy.
      - name: Verify API reference packaging
        shell: pwsh
        run: ./build/test-apireference-packaging.ps1 -Configuration Release -PackageDirectory nupkg

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate

      - name: Remove strong-name key
        if: ${{ always() && env.StrongNameKeyFile != '' }}
        shell: pwsh
        run: Remove-Item -LiteralPath $env:StrongNameKeyFile -Force -ErrorAction Stop
