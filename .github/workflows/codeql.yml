name: "CodeQL"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  # Not run per-pull-request, matching xavierjohn/Trellis. For a library of this
  # size the per-PR cost is not repaid; drift detection comes from the push-to-main
  # run and the weekly schedule, and ad-hoc runs remain available via dispatch.
  schedule:
    - cron: '43 23 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Restore dependencies
      run: dotnet restore src/Trellis.ResourceNaming.slnx

    - name: Build
      run: dotnet build src/Trellis.ResourceNaming.slnx --no-restore -c Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
