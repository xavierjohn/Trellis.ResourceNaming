# Manual publish of the resource-naming libraries to nuget.org via NuGet Trusted Publishing (OIDC).
#
# This is the PUBLIC channel. For the internal alpha channel see publish-github-packages.yml.
#
# Defaults to a dry run (pack only). Set dry_run = false to publish. Requires a Trusted Publishing policy on
# nuget.org for repository owner xavierjohn, repository Trellis.ResourceNaming, workflow file
# publish-nuget.yml and environment empty for the publish job, plus the NUGET_USER repository
# secret and the STRONG_NAME_KEY_BASE64 secret in the protected strong-name-signing environment.
# Packs Trellis.ResourceNaming.Abstractions and Trellis.ResourceNaming.Azure (the test project is not packable).
#
# The Trusted Publishing policy is bound to this FILE NAME. Renaming this workflow invalidates the policy
# and the publish step will fail to authenticate until the policy is updated to match.
name: Publish to NuGet.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pack only, do not push)'
        required: false
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]

permissions: {}

jobs:
  validate-ref:
    name: validate protected release ref
    runs-on: ubuntu-latest
    steps:
      - name: Require a protected public-release ref
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_PROTECTED -ne 'true') {
            Write-Host "::error::Signing and publishing require a protected branch."
            exit 1
          }
          if ($env:GITHUB_REF -ne 'refs/heads/main' -and
              $env:GITHUB_REF -notlike 'refs/heads/release/v*') {
            Write-Host "::error::Dispatch from main or a protected release/v* branch."
            exit 1
          }

  build-package:
    name: build signed packages
    needs: validate-ref
    runs-on: ubuntu-latest
    environment: strong-name-signing
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install strong-name verifier
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends --quiet mono-devel

      - name: Configure full strong-name signing
        shell: pwsh
        env:
          STRONG_NAME_KEY_BASE64: ${{ secrets.STRONG_NAME_KEY_BASE64 }}
        run: ./build/configure-strong-name-signing.ps1

      - name: Build + test (gate)
        run: |
          dotnet build Trellis.ResourceNaming.slnx -c Release
          dotnet test Trellis.ResourceNaming.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack Trellis.ResourceNaming.slnx -c Release -o nupkg

      - name: Verify full strong-name signatures
        shell: pwsh
        run: ./build/test-strong-name-packaging.ps1 -PackageDirectory nupkg -RequireFullSignature

      # Last line of defence before shipping. 0.1.0-preview.1 was published with a
      # green build and zero API reference docs inside it, because nothing on the
      # publish path inspected the packed output.
      #
      # Deliberately verifies the artifacts produced by the Pack step above rather
      # than packing its own copy, so the packages inspected here are the exact bytes
      # pushed below.
      - name: Verify API reference packaging
        shell: pwsh
        run: ./build/test-apireference-packaging.ps1 -Configuration Release -PackageDirectory nupkg

      - name: Upload verified packages
        uses: actions/upload-artifact@v7
        with:
          name: signed-nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 1

      - name: Remove strong-name key
        if: ${{ always() }}
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'Trellis.ResourceNaming.snk'
          if (Test-Path -LiteralPath $keyPath -PathType Leaf) {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction Stop
            Write-Host "Removed the materialized strong-name key."
          }

  publish:
    name: publish to nuget.org
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v8
        with:
          name: signed-nupkg
          path: nupkg

      - name: List packages
        run: ls -lh nupkg/*.nupkg

      # Nerdbank.GitVersioning appends a .g<commit> suffix to versions built from any ref that is
      # not a public release (main or release/v*). Such a version is a valid package but a dead end
      # on nuget.org: it can never be superseded by the clean version of the same build.
      # The validation job already rejects untrusted refs; this is a second check on the
      # downloaded package bytes immediately before requesting publish credentials.
      - name: Reject non-public-release versions
        shell: pwsh
        run: |
          $suffixed = @(Get-ChildItem nupkg/*.nupkg | Where-Object { $_.Name -match '\.g[0-9a-f]{8,}\.nupkg$' })
          if ($suffixed.Count -gt 0) {
            Write-Host "::error::Refusing to publish a non-public-release version: $($suffixed.Name -join ', ')"
            Write-Host "Dispatch this workflow from main (or a release/v* branch) instead."
            exit 1
          }
          Write-Host "All packages carry public-release versions."

      - name: NuGet login (OIDC trusted publishing)
        id: login
        if: ${{ inputs.dry_run == 'false' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: ${{ inputs.dry_run == 'false' }}
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Dry-run summary
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "DRY RUN — packages built but NOT published. Set dry_run = false to publish:"
          ls -lh nupkg/*.nupkg
