# Manual publish of the resource-naming libraries to nuget.org via NuGet Trusted Publishing (OIDC).
#
# This is the PUBLIC channel. For the internal alpha channel see publish-github-packages.yml.
#
# Defaults to a dry run (pack only). Set dry_run = false to publish. Requires a Trusted Publishing policy on
# nuget.org for repository owner xavierjohn, repository Trellis.ResourceNaming, workflow file
# publish-nuget.yml (environment empty), plus the NUGET_USER secret. Packs Trellis.ResourceNaming.Abstractions
# and Trellis.ResourceNaming.Azure (the test project is not packable).
#
# The Trusted Publishing policy is bound to this FILE NAME. Renaming this workflow invalidates the policy
# and the publish step will fail to authenticate until the policy is updated to match.
name: Publish to NuGet.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pack only, do not push)'
        required: false
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to nuget.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build + test (gate)
        run: |
          dotnet build Trellis.ResourceNaming.slnx -c Release
          dotnet test Trellis.ResourceNaming.slnx --no-build -c Release

      - name: Pack
        run: dotnet pack Trellis.ResourceNaming.slnx -c Release -o nupkg

      # Last line of defence before shipping. 0.1.0-preview.1 was published with a
      # green build and zero API reference docs inside it, because nothing on the
      # publish path inspected the packed output. PR CI runs this too, but only when
      # the path filter matches — this workflow can be dispatched from any commit.
      #
      # Deliberately verifies the artifacts produced by the Pack step above rather
      # than packing its own copy, so the packages inspected here are the exact bytes
      # pushed below.
      - name: Verify API reference packaging
        shell: pwsh
        run: ./build/test-apireference-packaging.ps1 -Configuration Release -PackageDirectory nupkg

      - name: List packages
        run: ls -lh nupkg/*.nupkg

      # Nerdbank.GitVersioning appends a .g<commit> suffix to versions built from any ref that is
      # not a public release (main or release/v*). Such a version is a valid package but a dead end
      # on nuget.org: it can never be superseded by the clean version of the same build. This
      # workflow is manually dispatched and accepts any ref, so the mistake is one dropdown away.
      - name: Reject non-public-release versions
        shell: pwsh
        run: |
          $suffixed = @(Get-ChildItem nupkg/*.nupkg | Where-Object { $_.Name -match '\.g[0-9a-f]{8,}\.nupkg$' })
          if ($suffixed.Count -gt 0) {
            Write-Host "::error::Refusing to publish a non-public-release version: $($suffixed.Name -join ', ')"
            Write-Host "Dispatch this workflow from main (or a release/v* branch) instead."
            exit 1
          }
          Write-Host "All packages carry public-release versions."

      - name: NuGet login (OIDC trusted publishing)
        id: login
        if: ${{ inputs.dry_run == 'false' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: ${{ inputs.dry_run == 'false' }}
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Dry-run summary
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "DRY RUN — packages built but NOT published. Set dry_run = false to publish:"
          ls -lh nupkg/*.nupkg
